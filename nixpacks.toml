[phases.setup]
# python3 added for the deterministic MYOB payroll-journal parser
# (scripts/payroll/parse_myob_payroll.py — pure stdlib, no pip deps).
nixPkgs = ["nodejs_22", "npm-10_x", "openssl", "python311"]

[phases.install]
cmds = ["npm ci --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
# Seed runs every boot — it upserts, so idempotent.
cmd = "prisma db push --skip-generate --accept-data-loss && tsx scripts/seed-entities.ts && npm start"
